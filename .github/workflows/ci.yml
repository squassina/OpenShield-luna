name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Markdown links and dashboard JavaScript
        run: python scripts/ops/check_static_assets.py
      - name: Validate audit anchoring shell script
        run: bash -n scripts/ops/upload_audit_anchor.sh
      - uses: docker/setup-buildx-action@v4
      - name: Build application and validation images
        run: docker compose build openshield-node openshield-gateway-connector openshield-test openshield-lint openshield-browser-test
      - name: Verify previous encryption key is forwarded to Node
        run: |
          docker compose config --format json | python -c 'import json, sys; env = json.load(sys.stdin)["services"]["openshield-node"]["environment"]; assert "OPENSHIELD_SECRET_KEY_PREVIOUS" in env'
      - name: Verify runtime images use the unprivileged account
        run: |
          test "$(docker compose run --rm --no-deps openshield-node id -u)" = "10001"
          test "$(docker compose --profile gateway run --rm --no-deps openshield-gateway-connector id -u)" = "10001"
      - name: Lint
        run: docker compose run --rm openshield-lint
      - name: Verify locked mypy satisfies the declared development constraint
        working-directory: backend
        run: |
          python - <<'PY'
          import tomllib
          from importlib.metadata import version
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          project = tomllib.load(open("pyproject.toml", "rb"))
          requirement = next(
              item for item in project["project"]["optional-dependencies"]["dev"]
              if item.startswith("mypy")
          )
          assert Version(version("mypy")) in SpecifierSet(requirement.removeprefix("mypy"))
          PY
      - name: Type check supported application modules
        run: |
          docker compose run --rm --no-deps openshield-lint mypy \
            openshield/events/models.py \
            openshield/gateway/models.py \
            openshield/gateway/spool.py \
            openshield/gateway/agent.py \
            openshield/gateway/client.py \
            openshield/core/storage_execution.py \
            openshield/core/storage_policies.py \
            openshield/execution/service.py
      - name: Audit installed Python dependencies
        run: docker compose run --rm --no-deps openshield-lint pip-audit --strict --progress-spinner off
      - name: Test
        run: docker compose run --rm openshield-test
      - name: Dashboard browser tests
        run: docker compose run --rm openshield-browser-test
      - name: PostgreSQL backup/restore round-trip
        run: |
          docker compose up -d openshield-db
          sh scripts/ops/ci_postgres_backup_restore_drill.sh
      - name: Smoke-test non-root Node and Gateway Connector startup
        run: |
          trap 'docker compose down' EXIT
          docker compose up -d openshield-node
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' openshield-luna-node)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs openshield-node
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' openshield-luna-node)" = "healthy"
          docker compose --profile gateway up -d openshield-gateway-connector
          test "$(docker exec openshield-luna-node id -u)" = "10001"
          test "$(docker exec openshield-luna-gateway-connector id -u)" = "10001"
