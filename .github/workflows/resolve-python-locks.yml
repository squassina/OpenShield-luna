name: Refresh Python dependency locks and image digests

on:
  push:
    branches:
      - build/reproducible-dependency-lock-and-image-updates
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned lock generator
        run: python -m pip install --disable-pip-version-check "pip==26.3" "pip-tools==7.7.0"
      - name: Refresh runtime, development and build dependency locks
        working-directory: backend
        run: |
          pip-compile --upgrade --resolver=backtracking --allow-unsafe --no-strip-extras --generate-hashes \
            --output-file requirements.txt pyproject.toml
          pip-compile --upgrade --resolver=backtracking --allow-unsafe --no-strip-extras --generate-hashes --extra dev \
            --output-file requirements-dev.txt pyproject.toml
          pip-compile --upgrade --resolver=backtracking --allow-unsafe --no-strip-extras --generate-hashes \
            --output-file requirements-build.txt requirements-build.in
      - name: Resolve current image manifest digests
        id: images
        run: |
          resolve_ref() {
            local ref="$1"
            local repository="${ref%:*}"
            docker pull "$ref" >/dev/null
            local resolved
            resolved="$(docker image inspect "$ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "${repository}@sha256:" | head -n 1)"
            if [ -z "$resolved" ]; then
              echo "Could not resolve manifest digest for $ref" >&2
              return 1
            fi
            printf '%s@%s\n' "$ref" "${resolved##*@}"
          }

          python_image="$(resolve_ref python:3.12-slim)"
          playwright_image="$(resolve_ref mcr.microsoft.com/playwright/python:v1.64.1-noble)"
          postgres_image="$(resolve_ref postgres:16-alpine)"

          python - "$python_image" "$playwright_image" "$postgres_image" <<'PY'
          from pathlib import Path
          import sys

          python_image, playwright_image, postgres_image = sys.argv[1:]
          dockerfile = Path("Dockerfile")
          docker_lines = dockerfile.read_text(encoding="utf-8").splitlines()
          pinned = {
              "FROM python:3.12-slim": f"FROM {python_image}",
              "FROM mcr.microsoft.com/playwright/python:v1.64.1-noble": (
                  f"FROM {playwright_image}"
              ),
          }
          for index, line in enumerate(docker_lines):
              for prefix, replacement in pinned.items():
                  suffix = " AS base" if prefix.endswith("python:3.12-slim") else " AS browser-test"
                  if line.startswith(prefix) and line.endswith(suffix):
                      docker_lines[index] = replacement + suffix
                      break
          if not any(line == f"FROM {python_image} AS base" for line in docker_lines):
              raise SystemExit("Python image digest was not applied to Dockerfile")
          if not any(
              line == f"FROM {playwright_image} AS browser-test" for line in docker_lines
          ):
              raise SystemExit("Playwright image digest was not applied to Dockerfile")
          dockerfile.write_text("\n".join(docker_lines) + "\n", encoding="utf-8")

          compose = Path("docker-compose.yml")
          compose_lines = compose.read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(compose_lines):
              if line.strip().startswith("image: postgres:16-alpine"):
                  compose_lines[index] = f"    image: {postgres_image}"
                  break
          else:
              raise SystemExit("PostgreSQL image was not found in docker-compose.yml")
          compose.write_text("\n".join(compose_lines) + "\n", encoding="utf-8")
          PY
      - name: Commit refreshed locks to the active implementation branch
        if: github.ref_name == 'build/reproducible-dependency-lock-and-image-updates'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements-build.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: update patched setuptools lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Open dependency and image refresh pull request
        if: github.ref_name != 'build/reproducible-dependency-lock-and-image-updates'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "build: refresh Python locks and container image digests"
          branch: maintenance/python-locks-and-image-digests
          delete-branch: true
          title: "build: refresh Python locks and container image digests"
          body: |
            Automated weekly refresh of the Python 3.12 runtime, development and build locks,
            including package hashes, plus the pinned Python, Playwright and PostgreSQL
            container manifest digests.

            CI must pass before merging. Review dependency changelogs and image release notes.
