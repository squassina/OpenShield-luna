name: Resolve Python dependency locks

on:
  push:
    branches:
      - build/reproducible-dependency-lock-and-image-updates
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned lock generator
        run: python -m pip install --disable-pip-version-check "pip==26.3" "pip-tools==7.7.0"
      - name: Resolve runtime and development dependency graphs
        working-directory: backend
        run: |
          pip-compile --resolver=backtracking --allow-unsafe --no-strip-extras --generate-hashes \
            --output-file requirements.txt pyproject.toml
          pip-compile --resolver=backtracking --allow-unsafe --no-strip-extras --generate-hashes --extra dev \
            --output-file requirements-dev.txt pyproject.toml
          pip-compile --resolver=backtracking --allow-unsafe --no-strip-extras --generate-hashes \
            --output-file requirements-build.txt requirements-build.in
      - name: Pin container images by resolved manifest digest
        run: |
          resolve_ref() {
            local ref="$1"
            local repository="${ref%:*}"
            docker pull "$ref" >/dev/null
            local resolved
            resolved="$(docker image inspect "$ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "${repository}@sha256:" | head -n 1)"
            if [ -z "$resolved" ]; then
              echo "Could not resolve manifest digest for $ref" >&2
              return 1
            fi
            printf '%s@%s\n' "$ref" "${resolved##*@}"
          }

          python_image="$(resolve_ref python:3.12-slim)"
          playwright_image="$(resolve_ref mcr.microsoft.com/playwright/python:v1.64.1-noble)"
          postgres_image="$(resolve_ref postgres:16-alpine)"

          python - "${python_image}" "${playwright_image}" "${postgres_image}" <<'PY'
          from pathlib import Path
          import sys

          python_image, playwright_image, postgres_image = sys.argv[1:]
          dockerfile = Path("Dockerfile")
          docker_lines = dockerfile.read_text(encoding="utf-8").splitlines()
          replacements = {
              "FROM python:3.12-slim AS base": f"FROM {python_image} AS base",
              "FROM mcr.microsoft.com/playwright/python:v1.64.1-noble AS browser-test": (
                  f"FROM {playwright_image} AS browser-test"
              ),
          }
          for index, line in enumerate(docker_lines):
              if line in replacements:
                  docker_lines[index] = replacements[line]
          if not all(value in docker_lines for value in replacements.values()):
              raise SystemExit("Expected Dockerfile base-image lines were not all replaced")
          dockerfile.write_text("\n".join(docker_lines) + "\n", encoding="utf-8")

          compose = Path("docker-compose.yml")
          compose_text = compose.read_text(encoding="utf-8")
          old_image = "    image: postgres:16-alpine"
          if old_image not in compose_text:
              raise SystemExit("Expected PostgreSQL image line was not found")
          compose.write_text(
              compose_text.replace(old_image, f"    image: {postgres_image}", 1),
              encoding="utf-8",
          )
          print(f"Pinned Python base: {python_image}")
          print(f"Pinned Playwright base: {playwright_image}")
          print(f"Pinned PostgreSQL image: {postgres_image}")
          PY
      - name: Commit resolved lock files to the pull request branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/pyproject.toml backend/requirements-build.in backend/requirements-build.txt backend/requirements.txt backend/requirements-dev.txt Dockerfile docker-compose.yml
          if ! git diff --cached --quiet; then
            git commit -m "build: add hash-pinned Python dependencies"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
      - name: Publish lock files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-locks
          if-no-files-found: error
          path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-build.txt
