name: Resolve Python dependency locks

on:
  push:
    branches:
      - build/reproducible-dependency-lock-and-image-updates

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned lock generator
        run: python -m pip install --disable-pip-version-check "pip==26.3" "pip-tools==7.7.0"
      - name: Resolve runtime and development dependency graphs
        working-directory: backend
        run: |
          pip-compile --resolver=backtracking --generate-hashes \
            --output-file requirements.txt pyproject.toml
          pip-compile --resolver=backtracking --generate-hashes --extra dev \
            --output-file requirements-dev.txt pyproject.toml
      - name: Publish resolved lock files
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-locks
          if-no-files-found: error
          path: |
            backend/requirements.txt
            backend/requirements-dev.txt
