name: Resolve Python dependency locks

on:
  push:
    branches:
      - build/reproducible-dependency-lock-and-image-updates
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned lock generator
        run: python -m pip install --disable-pip-version-check "pip==26.3" "pip-tools==7.7.0"
      - name: Resolve runtime and development dependency graphs
        working-directory: backend
        run: |
          pip-compile --resolver=backtracking --generate-hashes \
            --output-file requirements.txt pyproject.toml
          pip-compile --resolver=backtracking --generate-hashes --extra dev \
            --output-file requirements-dev.txt pyproject.toml
      - name: Commit resolved lock files to the pull request branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements.txt backend/requirements-dev.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: add hash-pinned Python dependencies"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
      - name: Publish lock files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-locks
          if-no-files-found: error
          path: |
            backend/requirements.txt
            backend/requirements-dev.txt
