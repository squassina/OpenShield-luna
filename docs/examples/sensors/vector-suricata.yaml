# Vector 0.62.0 — Suricata EVE JSONL to OpenShield.
# Mount the EVE file read-only and persist /var/lib/vector across restarts.
data_dir: /var/lib/vector

sources:
  suricata_eve:
    type: file
    include:
      - /var/log/suricata/eve.json
    read_from: beginning
    ignore_checkpoints: false
    fingerprint:
      strategy: checksum
    max_line_bytes: 262144

transforms:
  parse_suricata_eve:
    type: remap
    inputs:
      - suricata_eve
    source: |
      . = parse_json!(.message)
    drop_on_error: true
    reroute_dropped: false

sinks:
  openshield_suricata:
    type: http
    inputs:
      - parse_suricata_eve
    method: post
    uri: "${OPENSHIELD_NODE_URL}/api/v1/sensors/${OPENSHIELD_SENSOR_INTEGRATION_ID}/events"
    healthcheck:
      uri: "${OPENSHIELD_NODE_URL}/health/ready"
    auth:
      strategy: bearer
      token: "${OPENSHIELD_SENSOR_TOKEN}"
    request:
      concurrency: 1
      rate_limit_duration_secs: 60
      rate_limit_num: 45
      timeout_secs: 30
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 30
      headers:
        Content-Type: application/json
    batch:
      max_events: 100
      max_bytes: 3000000
      timeout_secs: 1
    framing:
      method: character_delimited
      character_delimited:
        delimiter: ","
    payload_prefix: "["
    payload_suffix: "]"
    encoding:
      codec: json
    buffer:
      type: disk
      max_size: 1073741824
      when_full: block
    acknowledgements:
      enabled: true
