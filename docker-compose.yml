name: openshield-luna

services:
  openshield-db:
    container_name: openshield-luna-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openshield
      POSTGRES_PASSWORD: ${OPENSHIELD_POSTGRES_PASSWORD:-openshield-dev-password}
      POSTGRES_DB: openshield
    volumes:
      - openshield-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openshield -d openshield"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  openshield-node:
    container_name: openshield-luna-node
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      OPENSHIELD_DATABASE_URL: ${OPENSHIELD_DATABASE_URL:-postgresql://openshield:openshield-dev-password@openshield-db:5432/openshield}
      OPENSHIELD_DNS_POLL_INTERVAL_SECONDS: ${OPENSHIELD_DNS_POLL_INTERVAL_SECONDS:-60}
      OPENSHIELD_SECRET_KEY: ${OPENSHIELD_SECRET_KEY:-}
      OPENSHIELD_API_AUTH_ENABLED: ${OPENSHIELD_API_AUTH_ENABLED:-false}
      OPENSHIELD_API_USERNAME: ${OPENSHIELD_API_USERNAME:-}
      OPENSHIELD_API_PASSWORD: ${OPENSHIELD_API_PASSWORD:-}
      OPENSHIELD_GATEWAY_TOKEN: ${OPENSHIELD_GATEWAY_TOKEN:-}
      OPENSHIELD_RUNTIME_SECRETS_DIR: /var/lib/openshield/secrets
    volumes:
      - openshield-runtime-secrets:/var/lib/openshield/secrets
    depends_on:
      openshield-db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  openshield-test:
    container_name: openshield-luna-test
    image: openshield-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles: ["tools"]
    environment:
      OPENSHIELD_DATABASE_URL: ${OPENSHIELD_DATABASE_URL:-postgresql://openshield:openshield-dev-password@openshield-db:5432/openshield}
    depends_on:
      openshield-db:
        condition: service_healthy
    command: ["pytest", "-v", "tests"]

  openshield-lint:
    container_name: openshield-luna-lint
    image: openshield-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles: ["tools"]
    command: ["ruff", "check", "openshield", "tests", "scripts/ops"]

  openshield-gateway-connector:
    container_name: openshield-luna-gateway-connector
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "-m", "openshield.gateway.agent"]
    environment:
      OPENSHIELD_NODE_URL: ${OPENSHIELD_NODE_URL:-http://openshield-node:8000}
      OPENSHIELD_GATEWAY_ID: ${OPENSHIELD_GATEWAY_ID:-}
      OPENSHIELD_GATEWAY_TOKEN: ${OPENSHIELD_GATEWAY_TOKEN:-}
      OPENSHIELD_RUNTIME_SECRETS_DIR: /var/lib/openshield/secrets
      OPENSHIELD_GATEWAY_HEARTBEAT_INTERVAL: ${OPENSHIELD_GATEWAY_HEARTBEAT_INTERVAL:-30}
      OPENSHIELD_OPENWRT_URL: ${OPENSHIELD_OPENWRT_URL:-}
      OPENSHIELD_OPENWRT_USERNAME: ${OPENSHIELD_OPENWRT_USERNAME:-}
      OPENSHIELD_OPENWRT_PASSWORD: ${OPENSHIELD_OPENWRT_PASSWORD:-}
      OPENSHIELD_GATEWAY_SPOOL_PATH: ${OPENSHIELD_GATEWAY_SPOOL_PATH:-/var/lib/openshield/gateway-spool.sqlite3}
    volumes:
      - openshield-gateway-spool:/var/lib/openshield
      - openshield-runtime-secrets:/var/lib/openshield/secrets:ro
    depends_on:
      openshield-node:
        condition: service_healthy
    restart: unless-stopped


volumes:
  openshield-postgres-data:
  openshield-gateway-spool:
  openshield-runtime-secrets:
