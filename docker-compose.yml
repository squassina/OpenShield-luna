services:
  openshield-node:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: openshield-node
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  openshield-test:
    image: openshield-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles: ["tools"]
    command: ["pytest", "-v", "tests"]

  openshield-lint:
    image: openshield-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles: ["tools"]
    command: ["ruff", "check", "openshield", "tests"]
