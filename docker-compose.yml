services:
  openshield-node:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: openshield-node
    environment:
      OPENSHIELD_API_KEYS: ${OPENSHIELD_API_KEYS:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  openshield-test:
    image: openshield-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles: ["tools"]
    command: ["pytest", "-v", "tests"]

  openshield-lint:
    image: openshield-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles: ["tools"]
    command: ["ruff", "check", "openshield", "tests"]

  openshield-gateway-connector:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: ["gateway"]
    command: ["python", "-m", "openshield.gateway.agent"]
    environment:
      OPENSHIELD_NODE_URL: ${OPENSHIELD_NODE_URL:-http://openshield-node:8000}
      OPENSHIELD_GATEWAY_ID: ${OPENSHIELD_GATEWAY_ID:-}
      OPENSHIELD_GATEWAY_API_KEY: ${OPENSHIELD_GATEWAY_API_KEY:-}
      OPENSHIELD_GATEWAY_HEARTBEAT_INTERVAL: ${OPENSHIELD_GATEWAY_HEARTBEAT_INTERVAL:-30}
    restart: unless-stopped
