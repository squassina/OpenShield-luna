[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openshield"
version = "0.1.0"
description = "OpenShield network security and privacy intelligence node"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "starlette>=0.46,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "html5lib>=1.1,<2.0",
  "playwright>=1.49,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.package-data]
openshield = ["dashboard.html", "privacy/data/*.txt", "privacy/data/*.json"]
