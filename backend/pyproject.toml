[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "openshield"
version = "0.1.0"
description = "OpenShield network security and privacy intelligence node"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "starlette>=1.3.1,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "cryptography>=50.0.0,<51.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "httpx2>=2.0,<3.0",
  "ruff>=0.6,<1.0",
  "html5lib>=1.1,<2.0",
  "playwright==1.65.2",
  "mypy>=1.11,<2.0",
  "pip-audit>=2.7,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.package-data]
openshield = ["dashboard.html", "privacy/data/*.txt", "privacy/data/*.json"]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
